services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lawrag}
      POSTGRES_USER: ${POSTGRES_USER:-lawrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]

  qdrant:
    image: qdrant/qdrant:v1.12.5
    volumes: [qdrant_data:/qdrant/storage]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-02-18T16-25-55Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me-minio}
    volumes: [minio_data:/data]

  ollama:
    image: ollama/ollama:latest
    volumes: [ollama_data:/root/.ollama]
    # Pull the configured model once after startup: docker compose exec ollama ollama pull Qwen3.5:2b

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://lawrag:change-me@postgres:5432/lawrag}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    depends_on: [postgres, redis, qdrant, minio, ollama]
    ports: ["8000:8000"]
    volumes: [hf_cache:/root/.cache/huggingface]

  worker:
    build: ./backend
    command: celery -A app.celery_app.celery worker --loglevel=INFO
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://lawrag:change-me@postgres:5432/lawrag}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    depends_on: [api, redis]
    volumes: [hf_cache:/root/.cache/huggingface]

  frontend:
    build: ./frontend
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  ollama_data:
  hf_cache:
